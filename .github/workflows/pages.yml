# Build owg-css and publish demo/ (with dist/ and fonts/) to GitHub Pages.
# Repo settings: Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: npm ci
      - run: mise run build
      - name: Stage site (demo/ as root, dist/ and fonts/ beside it)
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp -r demo/. _site/
          cp -r dist _site/dist
          [ -d fonts ] && cp -r fonts _site/fonts || true
          # The demo links ../dist/ (to work from a checkout); on the site dist/ is a sibling.
          find _site -maxdepth 1 -name '*.html' -exec sed -i 's#\.\./dist/#dist/#g' {} +
          touch _site/.nojekyll
          ls -R _site | head -50
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
